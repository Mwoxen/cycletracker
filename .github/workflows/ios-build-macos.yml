# Fallback: build the iOS app on a GitHub-hosted macOS runner instead of on EAS's servers.
# Free on this public repository and it does not use the monthly EAS build quota: EAS CLI runs the
# build here ("eas build --local") with the signing certificate and profile it already keeps for
# the app, so nothing has to be exported from EAS or added as a secret. The result is uploaded to
# TestFlight with "eas submit", which is free as well.
#
# Manual trigger only (Actions > "iOS build (macOS fallback)" > Run workflow, pick the branch).
# Needs the same secrets as eas-build.yml: EXPO_TOKEN, ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY_P8,
# APPLE_TEAM_ID, REVENUECAT_IOS_KEY, and ASC_APP_ID for the upload.
#
# The macos-26 image is needed: Expo SDK 57 does not compile with the Xcode versions on macos-15.
name: iOS build (macOS fallback)

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to App Store Connect (TestFlight) when the build succeeds
        type: boolean
        default: true

concurrency:
  group: ios-build-macos
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      REVENUECAT_IOS_KEY: ${{ secrets.REVENUECAT_IOS_KEY }}
      ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
    steps:
      - name: Check required secrets
        run: |
          for name in EXPO_TOKEN ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name (see SETUP.md)"; exit 1; fi
          done
          if [ -z "${{ secrets.ASC_API_KEY_P8 }}" ]; then echo "::error::Missing secret ASC_API_KEY_P8"; exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)" && xcodebuild -version

      - run: npm ci

      - name: Require a linked EAS project
        run: |
          if [ ! -s .eas-project-id ]; then
            echo "::error::No .eas-project-id yet. Run the 'EAS Update' workflow once first (it links the project)."
            exit 1
          fi

      - name: Show what the build will be signed with
        run: |
          npx expo config --type introspect --json 2>/dev/null | node -e '
            let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const c = JSON.parse(s.slice(s.indexOf("{")));
              console.log(JSON.stringify(c.ios.entitlements, null, 2));
            });'

      - name: Write the App Store Connect API key and the build environment
        run: |
          printf '%s' "${{ secrets.ASC_API_KEY_P8 }}" > asc-api-key.p8
          node -e '
            const fs = require("fs");
            const eas = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            // The same environment as eas-build.yml, so the runtime fingerprint is the same as the
            // one the EAS Update workflow computes; otherwise updates never reach this build.
            eas.build.production.env = {
              ...(eas.build.production.env || {}),
              APPLE_TEAM_ID: process.env.APPLE_TEAM_ID,
              ...(process.env.REVENUECAT_IOS_KEY ? { REVENUECAT_IOS_KEY: process.env.REVENUECAT_IOS_KEY } : {}),
            };
            eas.submit.production.ios = {
              ascApiKeyPath: "./asc-api-key.p8",
              ascApiKeyId: process.env.ASC_KEY_ID,
              ascApiKeyIssuerId: process.env.ASC_ISSUER_ID,
              appleTeamId: process.env.APPLE_TEAM_ID,
              ...(process.env.ASC_APP_ID ? { ascAppId: process.env.ASC_APP_ID } : {}),
            };
            fs.writeFileSync("eas.json", JSON.stringify(eas, null, 2) + "\n");
          '

      - name: Build on this runner with the credentials EAS keeps
        env:
          EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/asc-api-key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: ${{ secrets.APPLE_TEAM_TYPE || 'INDIVIDUAL' }}
          EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/eas-local
        run: |
          set -o pipefail
          eas build --platform ios --profile production --local --non-interactive \
            --output "$RUNNER_TEMP/CycleTracker.ipa" 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        run: |
          if [ -z "$ASC_APP_ID" ]; then
            echo "::error::ASC_APP_ID secret is not set, so the build cannot be submitted (SETUP.md step 3)."
            exit 1
          fi
          eas submit --platform ios --profile production --non-interactive \
            --path "$RUNNER_TEMP/CycleTracker.ipa"

      - name: Keep the IPA as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CycleTracker-ipa
          path: ${{ runner.temp }}/CycleTracker.ipa
          if-no-files-found: ignore

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/eas-local/**/*.log
          if-no-files-found: ignore

      - name: Remove the API key
        if: always()
        run: rm -f asc-api-key.p8
