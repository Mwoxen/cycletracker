# Fallback: build and upload the iOS app on a GitHub-hosted macOS runner instead of EAS Build.
# Free on this public repository. Use it if the monthly EAS build quota is exhausted.
#
# Manual trigger only (Actions > "iOS build (macOS fallback)" > Run workflow, pick the branch).
# Needs the secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY_P8 and APPLE_TEAM_ID, and REVENUECAT_IOS_KEY
# so the purchase screen works. APPLE_TEAM_ID and REVENUECAT_IOS_KEY are also read by app.config.ts
# and are part of the runtime fingerprint, which is why they must be the same as in eas-update.yml:
# otherwise over-the-air updates never reach the build. The log prints the runtime version to check.
#
# The macos-26 image is needed: Expo SDK 57 does not compile with the Xcode versions on macos-15.
name: iOS build (macOS fallback)

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to App Store Connect (TestFlight) when the build succeeds
        type: boolean
        default: true

concurrency:
  group: ios-build-macos
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      REVENUECAT_IOS_KEY: ${{ secrets.REVENUECAT_IOS_KEY }}
    steps:
      - name: Check required secrets
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name (see SETUP.md)"; exit 1; fi
          done
          if [ -z "${{ secrets.ASC_API_KEY_P8 }}" ]; then echo "::error::Missing secret ASC_API_KEY_P8"; exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)" && xcodebuild -version

      - run: npm ci

      - name: Generate the native project
        run: npx expo prebuild --platform ios --clean

      - name: Show what the build will be signed with and which runtime version it gets
        run: |
          cat ios/*/*.entitlements
          grep -A1 "EXUpdatesRuntimeVersion" ios/*/Supporting/Expo.plist || true

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Write the App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          printf '%s' "${{ secrets.ASC_API_KEY_P8 }}" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${{ inputs.upload && 'upload' || 'export' }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><true/>
          </dict></plist>
          EOF

      - name: Archive
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -workspace CycleTracker.xcworkspace \
            -scheme CycleTracker \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CycleTracker.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*(sign|provision|entitle)|ARCHIVE (SUCCEEDED|FAILED)" | head -60

      - name: Export and upload
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CycleTracker.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log" | tail -n 60

      - name: Keep the IPA as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CycleTracker-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore

      - name: Keep the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore

      - name: Remove the API key
        if: always()
        run: rm -rf ~/private_keys ExportOptions.plist
