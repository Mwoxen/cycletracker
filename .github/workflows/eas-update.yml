# Publishes every push to main as an over-the-air update:
#   - channel "production": picked up by the TestFlight / App Store build on next launch
#   - channel "expo-go":    loadable in the Expo Go app without any build
#
# The first run creates the EAS project and commits its id to `.eas-project-id`.
# Requires the EXPO_TOKEN repository secret (see SETUP.md).
name: EAS Update

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eas-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Publish OTA update
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Part of the native fingerprint (ios.appleTeamId). Must match the build workflow, or the
      # runtime version differs and no update ever reaches the TestFlight build.
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Stop early when EXPO_TOKEN is missing
        if: env.EXPO_TOKEN == ''
        run: |
          echo "::warning::EXPO_TOKEN secret is not set. Follow SETUP.md step 1 to enable OTA updates."
          exit 0

      - uses: actions/checkout@v4
        if: env.EXPO_TOKEN != ''
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        if: env.EXPO_TOKEN != ''
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci
        if: env.EXPO_TOKEN != ''

      - name: Create the EAS project on first run
        if: env.EXPO_TOKEN != ''
        env:
          EXPO_ACCOUNT_OVERRIDE: ${{ vars.EXPO_ACCOUNT }}
        run: |
          if [ -s .eas-project-id ]; then
            echo "EAS project id: $(cat .eas-project-id)"
            exit 0
          fi
          # `eas whoami` prints "<username> (authenticated using EXPO_TOKEN)" on the first line.
          ACCOUNT="${EXPO_ACCOUNT_OVERRIDE:-$(eas whoami 2>/dev/null | head -n 1 | awk '{print $1}')}"
          echo "Creating or linking EAS project for account: $ACCOUNT"
          # With a dynamic app.config.ts, `eas init` creates the project but exits non-zero because it
          # cannot write the id into the config itself. The id is still printed, so read it from the output.
          eas init --account "$ACCOUNT" --non-interactive --force > eas-init.log 2>&1 || true
          cat eas-init.log
          PROJECT_ID=$(grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' eas-init.log | head -n 1)
          rm -f eas-init.log
          if ! echo "$PROJECT_ID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::Could not determine the EAS project id (got '$PROJECT_ID'). Set a repository variable EXPO_ACCOUNT to your Expo username and re-run."
            exit 1
          fi
          echo "$PROJECT_ID" > .eas-project-id
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .eas-project-id
          git commit -m "Link EAS project (${PROJECT_ID})"
          git push origin HEAD:main

      - name: Publish update for real builds (fingerprint runtime)
        if: env.EXPO_TOKEN != ''
        run: |
          eas update --channel production --platform ios --auto --non-interactive --json > update.json
          UPDATE_RT=$(node -e "const u=require('./update.json');console.log((Array.isArray(u)?u[0]:u).runtimeVersion||'')")
          eas build:list --platform ios --limit 1 --json --non-interactive > build.json
          BUILD_RT=$(node -e "const b=require('./build.json')[0];console.log(b&&b.runtime?b.runtime.version:'')")
          rm -f update.json build.json
          echo "Update runtime version: $UPDATE_RT"
          echo "Latest build runtime:   $BUILD_RT"
          if [ -n "$BUILD_RT" ] && [ "$UPDATE_RT" != "$BUILD_RT" ]; then
            echo "::warning::This update will NOT reach the latest build: runtime versions differ (native dependencies or config changed). A new build is needed; push a change to app.config.ts/package.json or run the EAS Build workflow."
          fi

      - name: Publish update for Expo Go preview (SDK runtime)
        if: env.EXPO_TOKEN != ''
        env:
          EXPO_GO_PREVIEW: '1'
        run: eas update --channel expo-go --platform ios --auto --non-interactive
