# Compiles the native iOS project on a GitHub-hosted macOS runner, without signing and without
# using any EAS build. It catches Swift and native-module errors before a real build is spent.
# Runs on pushes to the feature branch when native files change, and by hand.
name: iOS compile check

on:
  push:
    branches: [claude/optimistic-cray-yglmqq]
    paths:
      - modules/**
      - plugins/**
      - app.config.ts
      - package.json
      - .github/workflows/ios-compile-check.yml
  workflow_dispatch:

concurrency:
  group: ios-compile-check
  cancel-in-progress: true

jobs:
  compile:
    name: compile (Xcode ${{ matrix.xcode }}, ${{ matrix.mode }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # The newest Xcode on the runner can be ahead of what Expo supports; try a few.
        xcode: ['16.4', '26.0']
        mode: [simulator, device]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode_*.app
          app="$(ls -d /Applications/Xcode_${{ matrix.xcode }}*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$app"
          xcodebuild -version

      - run: npm ci

      - name: Generate the native project
        run: npx expo prebuild --platform ios --clean

      - name: Show the entitlements the project will be signed with
        run: cat ios/*/*.entitlements || true

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Compile for the simulator, unsigned
        working-directory: ios
        run: |
          set -o pipefail
          if [ "${{ matrix.mode }}" = device ]; then
            sdk=iphoneos; dest='generic/platform=iOS'; conf=Release
          else
            sdk=iphonesimulator; dest='generic/platform=iOS Simulator'; conf=Debug
          fi
          xcodebuild -workspace CycleTracker.xcworkspace \
            -scheme CycleTracker \
            -configuration "$conf" \
            -sdk "$sdk" \
            -destination "$dest" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: unused|BUILD (SUCCEEDED|FAILED)|\*\* BUILD" | head -80

      - name: Keep the full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ matrix.xcode }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
